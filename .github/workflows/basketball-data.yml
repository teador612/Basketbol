name: Basketbol veri güncelleme
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Kendi Basketbol repomuz
      - name: Basketbol reposunu al
        uses: actions/checkout@v7
        with:
          path: main
      # Hazır basketball-dataset reposu
      - name: Hazır basketbol reposunu al
        uses: actions/checkout@v7
        with:
          repository: timurkulenovic/basketball-dataset
          path: source-basketball-dataset
      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Gerekli paketleri kur
        working-directory: main
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests
      - name: Kaynak repo kontrolü
        run: |
          echo "========================================"
          echo "Hazır repo kontrolü"
          echo "========================================"
          ls -la source-basketball-dataset
          echo ""
          echo "SRC:"
          find source-basketball-dataset/src -maxdepth 2 -type f | sort
          echo ""
          echo "DATA:"
          find source-basketball-dataset/data -maxdepth 2 -type f | head -50
      # BURADA hazır repodaki gerçek scraper'ı çalıştıracağız.
      # Önce hangi src dosyasının EuroLeague/NBA verisini
      # ürettiğini kesin olarak belirliyoruz.
      #
      # Şimdilik tahmin ederek çalıştırmıyoruz.
      - name: Durumu göster
        working-directory: main
        run: |
          echo "Hazır kaynak repo başarıyla çekildi."
          echo "Bir sonraki aşamada gerçek scraper çalıştırılacak."
      - name: Değişiklik var mı
        working-directory: main
        run: |
          git status --short
      - name: Verileri kaydet
        working-directory: main
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Basketbol verileri güncellendi"
            git push
          else
            echo "Yeni veri yok."
          fi
