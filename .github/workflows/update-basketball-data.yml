      - name: 🔎 Sonuçları kontrol et
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          basketball_file = Path("data/basketball.json")
          predictions_file = Path("predictions.json")

          print("=" * 60)
          print("🏀 BASKETBOL VERİ KONTROL")
          print("=" * 60)

          if not basketball_file.exists():
              print("❌ basketball.json bulunamadı")
              raise SystemExit(1)

          with open(basketball_file, encoding="utf-8") as f:
              data = json.load(f)

          print("Toplam maç:", data.get("total"))
          print("NBA:", data.get("nba"))
          print("NBA oynanan:", data.get("nbaFinished"))
          print("EuroLeague:", data.get("euroleague"))
          print("EuroLeague oynanan:", data.get("euroleagueFinished"))

          print()
          print("=" * 60)
          print("🎯 TAHMİN KONTROL")
          print("=" * 60)

          if not predictions_file.exists():
              print("❌ predictions.json bulunamadı")
              raise SystemExit(1)

          with open(predictions_file, encoding="utf-8") as f:
              prediction_data = json.load(f)

          predictions = prediction_data.get("predictions", [])

          home_5 = 0
          away_5 = 0
          both_5 = 0
          incomplete = 0
          main_predictions = 0

          incomplete_matches = []

          for item in predictions:

              home_sample = len(item.get("homeLast5", []))
              away_sample = len(item.get("awayLast5", []))

              if home_sample == 5:
                  home_5 += 1

              if away_sample == 5:
                  away_5 += 1

              if home_sample == 5 and away_sample == 5:
                  both_5 += 1
              else:
                  incomplete += 1

                  eksik = []

                  if home_sample < 5:
                      eksik.append(f"Ev {home_sample}/5")

                  if away_sample < 5:
                      eksik.append(f"Dep {away_sample}/5")

                  incomplete_matches.append({
                      "date": item.get("date"),
                      "home": item.get("home"),
                      "away": item.get("away"),
                      "details": ", ".join(eksik)
                  })

              if item.get("prediction"):
                  main_predictions += 1

          print("Toplam gelecek maç:", len(predictions))
          print("🏠 Ev 5/5:", home_5)
          print("✈️ Deplasman 5/5:", away_5)
          print("✅ İki taraf 5/5:", both_5)
          print("⚠️ Eksik Son 5:", incomplete)
          print("🎯 Ana tahmin:", main_predictions)

          print()
          print("=" * 60)
          print("⚠️ 5/5 OLMAYAN MAÇLAR")
          print("=" * 60)

          if not incomplete_matches:
              print("✅ Tüm maçlarda iki taraf da 5/5.")
          else:
              for i, item in enumerate(incomplete_matches, 1):

                  print(
                      f"{i}. {item['home']} - {item['away']}"
                  )

                  print(
                      f"   📅 {item['date']}"
                  )

                  print(
                      f"   ❌ {item['details']}"
                  )

          print()
          print("=" * 60)
          print("📊 EKSİK VERİ ÖZETİ")
          print("=" * 60)

          print("Toplam eksik maç:", incomplete)
          print("Tam 5/5 maç:", both_5)

          if predictions:
              percentage = both_5 / len(predictions) * 100
              print(
                  f"5/5 oranı: %{percentage:.1f}"
              )

          print()
          print("✅ VERİ + TAHMİN KONTROLÜ TAMAM")
          PY
