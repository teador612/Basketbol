name: Basketbol Veri ve Tahmin Güncelleme

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Repo indir
        uses: actions/checkout@v4

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🏀 Basketbol verilerini güncelle
        run: |
          python update_basketball_data.py

      - name: 🎯 Tahminleri oluştur
        run: |
          python predictions.py

      - name: 🔎 Sonuçları kontrol et
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          basketball_file = Path("data/basketball.json")
          predictions_file = Path("predictions.json")

          print("=" * 60)
          print("🏀 BASKETBOL VERİ KONTROL")
          print("=" * 60)

          if not basketball_file.exists():
              print("❌ basketball.json bulunamadı")
              raise SystemExit(1)

          with open(basketball_file, encoding="utf-8") as f:
              data = json.load(f)

          print("Toplam maç:", data.get("total"))
          print("NBA:", data.get("nba"))
          print("NBA oynanan:", data.get("nbaFinished"))
          print("EuroLeague:", data.get("euroleague"))
          print("EuroLeague oynanan:", data.get("euroleagueFinished"))

          print()
          print("=" * 60)
          print("🎯 TAHMİN KONTROL")
          print("=" * 60)

          if not predictions_file.exists():
              print("❌ predictions.json bulunamadı")
              raise SystemExit(1)

          with open(predictions_file, encoding="utf-8") as f:
              prediction_data = json.load(f)

          predictions = prediction_data.get("predictions", [])

          home_5 = 0
          away_5 = 0
          both_5 = 0
          incomplete = 0
          main_predictions = 0

          for item in predictions:

              home_sample = len(
                  item.get("homeLast5", [])
              )

              away_sample = len(
                  item.get("awayLast5", [])
              )

              if home_sample == 5:
                  home_5 += 1

              if away_sample == 5:
                  away_5 += 1

              if home_sample == 5 and away_sample == 5:
                  both_5 += 1
              else:
                  incomplete += 1

              if item.get("prediction"):
                  main_predictions += 1

          print("Toplam gelecek maç:", len(predictions))
          print("🏠 Ev 5/5:", home_5)
          print("✈️ Deplasman 5/5:", away_5)
          print("✅ İki taraf 5/5:", both_5)
          print("⚠️ Eksik Son 5:", incomplete)
          print("🎯 Ana tahmin:", main_predictions)

          print()
          print("✅ VERİ + TAHMİN KONTROLÜ TAMAM")
          PY

      - name: 💾 Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/basketball.json predictions.json

          if git diff --cached --quiet; then
            echo "ℹ️ Yeni değişiklik yok."
          else
            git commit -m "Basketbol verileri ve tahminler güncellendi"
            git push
          fi
