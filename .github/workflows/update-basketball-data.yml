name: Basketbol Veri ve Tahmin Güncelleme

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: basketbol-veri-guncelleme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # REPO
      # ==================================================

      - name: 📥 Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================================================
      # PYTHON
      # ==================================================

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==================================================
      # PAKETLER
      # ==================================================

      - name: 📦 Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==================================================
      # BASKETBOL VERİLERİ
      # ==================================================

      - name: 🏀 Basketbol verilerini güncelle
        run: |
          python update_basketball_data.py

      # ==================================================
      # BİLYONER GERÇEK BAREMLER
      # ==================================================

      - name: 💰 Bilyoner baremlerini güncelle
        run: |
          python update_basketball_odds.py

      # ==================================================
      # TAHMİNLER
      # ==================================================

      - name: 🎯 Tahminleri oluştur
        run: |
          python predictions.py

      # ==================================================
      # SONUÇLAR
      # ==================================================

      - name: 📊 Sonuçları hesapla
        run: |
          python results.py

      # ==================================================
      # ANALİZ
      # ==================================================

      - name: 🔬 Tahmin performansını analiz et
        run: |
          python analysis.py

      # ==================================================
      # DOSYA KONTROLÜ
      # ==================================================

      - name: 🔎 Dosyaları kontrol et
        run: |
          echo "========================================"
          echo "📁 DOSYA KONTROLÜ"
          echo "========================================"

          test -f basketball.json
          test -f odds.json
          test -f predictions.json
          test -f results.json
          test -f analysis.json

          echo ""
          echo "🏀 basketball.json"
          ls -lh basketball.json

          echo ""
          echo "💰 odds.json"
          ls -lh odds.json

          echo ""
          echo "🎯 predictions.json"
          ls -lh predictions.json

          echo ""
          echo "📊 results.json"
          ls -lh results.json

          echo ""
          echo "🔬 analysis.json"
          ls -lh analysis.json

          echo ""
          echo "========================================"
          echo "✅ TÜM DOSYALAR HAZIR"
          echo "========================================"

      # ==================================================
      # GIT
      # ==================================================

      - name: 💾 Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ Yeni değişiklik yok."
            exit 0
          fi

          git commit -m "Basketbol verileri ve baremler güncellendi"

      # ==================================================
      # REMOTE SENKRONİZASYON
      # ==================================================

      - name: 🔄 Remote ile senkronize ol
        run: |
          git fetch origin main
          git rebase origin/main

      # ==================================================
      # PUSH
      # ==================================================

      - name: 🚀 GitHub'a gönder
        run: |
          git push origin HEAD:main
