name: Basketbol Veri ve Tahmin Güncelleme

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: basketbol-veri-guncelleme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Repo indir
        uses: actions/checkout@v4

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🏀 Basketbol verilerini güncelle
        run: |
          python update_basketball_data.py

      - name: 🎯 Tahminleri oluştur
        run: |
          python predictions.py

      - name: 🔎 Veri ve tahmin kontrolü
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          basketball_file = Path("basketball.json")
          data_file = Path("data/basketball.json")
          predictions_file = Path("predictions.json")

          print("=" * 70)
          print("🏀 BASKETBOL VERİ + TAHMİN KONTROLÜ")
          print("=" * 70)

          # --------------------------------------------------
          # BASKETBOL VERİSİ
          # --------------------------------------------------

          if data_file.exists():
              basketball_file = data_file

          if not basketball_file.exists():
              print("❌ basketball.json bulunamadı")
              raise SystemExit(1)

          with basketball_file.open(encoding="utf-8") as f:
              data = json.load(f)

          matches = data.get("matches", [])

          print()
          print("📊 BASKETBOL VERİSİ")
          print("-" * 70)

          print("Toplam maç       :", data.get("total", len(matches)))
          print("NBA              :", data.get("nba"))
          print("NBA tamamlanan   :", data.get("nbaFinished"))
          print("EuroLeague       :", data.get("euroleague"))
          print("EuroLeague tamam :", data.get("euroleagueFinished"))

          print()
          print("Toplam kayıt     :", len(matches))

          # --------------------------------------------------
          # PERİYOT KONTROLÜ
          # --------------------------------------------------

          period_matches = 0
          finished_matches = 0

          for match in matches:
              if match.get("played"):
                  finished_matches += 1

              if match.get("hasPeriodData"):
                  period_matches += 1

          print("Tamamlanan maç   :", finished_matches)
          print("Periyot verili   :", period_matches)

          # --------------------------------------------------
          # LİG KONTROLÜ
          # --------------------------------------------------

          nba_count = 0
          euro_count = 0
          euro_finished = 0

          for match in matches:
              league = str(match.get("league", "")).upper()

              if league == "NBA":
                  nba_count += 1

              elif league in ("E", "EUROLEAGUE", "EUROPE"):
                  euro_count += 1

                  if match.get("played"):
                      euro_finished += 1

          print("NBA kayıt        :", nba_count)
          print("EuroLeague kayıt :", euro_count)
          print("EuroLeague biten :", euro_finished)

          # --------------------------------------------------
          # TAHMİN DOSYASI
          # --------------------------------------------------

          print()
          print("=" * 70)
          print("🎯 TAHMİN KONTROLÜ")
          print("=" * 70)

          if not predictions_file.exists():
              print("❌ predictions.json bulunamadı")
              raise SystemExit(1)

          with predictions_file.open(encoding="utf-8") as f:
              prediction_data = json.load(f)

          predictions = prediction_data.get("predictions", [])

          print("Tahmin sayısı    :", len(predictions))

          if not predictions:
              print("❌ Hiç tahmin oluşturulmamış.")
              raise SystemExit(1)

          # --------------------------------------------------
          # ÖRNEKLEM KONTROLÜ
          # --------------------------------------------------

          sample_1 = 0
          sample_2 = 0
          sample_3 = 0
          sample_4 = 0
          sample_5 = 0
          sample_more = 0

          no_home_history = 0
          no_away_history = 0

          main_predictions = 0
          match_totals = 0
          first_half_totals = 0
          q1_predictions = 0
          q2_predictions = 0
          q3_predictions = 0
          q4_predictions = 0

          for item in predictions:

              home_sample = len(item.get("homeLast5", []))
              away_sample = len(item.get("awayLast5", []))

              minimum_sample = min(home_sample, away_sample)

              if minimum_sample <= 0:
                  no_home_history += home_sample == 0
                  no_away_history += away_sample == 0

              elif minimum_sample == 1:
                  sample_1 += 1

              elif minimum_sample == 2:
                  sample_2 += 1

              elif minimum_sample == 3:
                  sample_3 += 1

              elif minimum_sample == 4:
                  sample_4 += 1

              elif minimum_sample == 5:
                  sample_5 += 1

              else:
                  sample_more += 1

              if item.get("prediction"):
                  main_predictions += 1

              if item.get("matchTotal"):
                  match_totals += 1

              if item.get("firstHalfTotal"):
                  first_half_totals += 1

              if item.get("q1"):
                  q1_predictions += 1

              if item.get("q2"):
                  q2_predictions += 1

              if item.get("q3"):
                  q3_predictions += 1

              if item.get("q4"):
                  q4_predictions += 1

          # --------------------------------------------------
          # ÖRNEKLEM RAPORU
          # --------------------------------------------------

          print()
          print("📚 KULLANILAN GEÇMİŞ ÖRNEKLEMİ")
          print("-" * 70)

          print("1 maç geçmişi    :", sample_1)
          print("2 maç geçmişi    :", sample_2)
          print("3 maç geçmişi    :", sample_3)
          print("4 maç geçmişi    :", sample_4)
          print("5 maç geçmişi    :", sample_5)
          print("5+ maç geçmişi   :", sample_more)

          print()
          print("Geçmişi olmayan ev takımı :", no_home_history)
          print("Geçmişi olmayan deplasman :", no_away_history)

          # --------------------------------------------------
          # TAHMİN RAPORU
          # --------------------------------------------------

          print()
          print("🎯 TAHMİN DAĞILIMI")
          print("-" * 70)

          print("Ana 1/X/2 tahmini :", main_predictions)
          print("Maç Alt/Üst       :", match_totals)
          print("İY Alt/Üst         :", first_half_totals)
          print("Q1 Alt/Üst         :", q1_predictions)
          print("Q2 Alt/Üst         :", q2_predictions)
          print("Q3 Alt/Üst         :", q3_predictions)
          print("Q4 Alt/Üst         :", q4_predictions)

          # --------------------------------------------------
          # İLK TAHMİN ÖRNEKLERİ
          # --------------------------------------------------

          print()
          print("=" * 70)
          print("🔍 İLK TAHMİNLER")
          print("=" * 70)

          for i, item in enumerate(predictions[:10], 1):

              home = item.get("home", "?")
              away = item.get("away", "?")
              date = item.get("date", "?")

              home_sample = len(item.get("homeLast5", []))
              away_sample = len(item.get("awayLast5", []))

              print()
              print(f"{i}. {home} - {away}")
              print(f"   📅 {date}")
              print(f"   📚 Geçmiş: Ev {home_sample} / Dep {away_sample}")
              print(f"   🎯 Ana: {item.get('prediction', '-')}")

              match_total = item.get("matchTotal")
              if match_total:
                  print(
                      f"   🏀 Maç toplam: "
                      f"{match_total.get('line', '-')} "
                      f"{match_total.get('prediction', '-')}"
                  )

              first_half = item.get("firstHalfTotal")
              if first_half:
                  print(
                      f"   ⏱️ İY toplam: "
                      f"{first_half.get('line', '-')} "
                      f"{first_half.get('prediction', '-')}"
                  )

              for period_name in ("q1", "q2", "q3", "q4"):
                  period = item.get(period_name)

                  if period:
                      print(
                          f"   {period_name.upper()}: "
                          f"{period.get('line', '-')} "
                          f"{period.get('prediction', '-')}"
                      )

          # --------------------------------------------------
          # GENEL SONUÇ
          # --------------------------------------------------

          print()
          print("=" * 70)
          print("✅ KONTROL TAMAMLANDI")
          print("=" * 70)

          print()
          print("✔ Basketbol verisi bulundu")
          print("✔ Tahmin dosyası bulundu")
          print("✔ Tahminler oluşturuldu")
          print("✔ Eksik geçmiş maçları hata olarak kabul edilmedi")
          print("✔ EuroLeague mevcut sezon verileri kullanılabilir")
          print("✔ Ana tahminler oluşturuluyor")
          print("✔ Maç / İY / Q1 / Q2 / Q3 / Q4 tahminleri kontrol edildi")
          PY

      - name: 💾 Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add basketball.json data/basketball.json predictions.json

          if git diff --cached --quiet; then
            echo "ℹ️ Yeni değişiklik yok."
          else
            git commit -m "Basketbol verileri ve tahminler güncellendi"
            git push
          fi
