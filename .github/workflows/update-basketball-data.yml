name: Basketbol Veri Güncelleme

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo indir
        uses: actions/checkout@v4

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🏀 Basketbol verilerini güncelle
        run: |
          python update_basketball_data.py

      - name: 🔎 Veri kontrolü
        run: |
          python - <<'PY'
          import json

          with open("data/basketball.json", encoding="utf-8") as f:
              data = json.load(f)

          matches = data.get("matches", [])

          print("========================================")
          print("🏀 BASKETBOL DATA KONTROL")
          print("========================================")

          print("Güncelleme:", data.get("updatedAt"))
          print("Toplam maç:", data.get("total"))
          print("NBA:", data.get("nba"))
          print("NBA oynanan:", data.get("nbaFinished"))
          print("EuroLeague:", data.get("euroleague"))
          print("EuroLeague oynanan:", data.get("euroleagueFinished"))

          print()
          print("========================================")
          print("🔎 SON 5 VERİ KONTROLÜ")
          print("========================================")

          checked = 0

          for match in matches:
              home_last5 = match.get("homeLast5", [])
              away_last5 = match.get("awayLast5", [])

              if home_last5 or away_last5:
                  print()
                  print(
                      f'{match.get("league")} | '
                      f'{match.get("homeTeam")} - {match.get("awayTeam")}'
                  )

                  print("Ev son 5:")
                  for x in home_last5:
                      print(
                          f'  {x.get("date")} | '
                          f'{x.get("scored")}-{x.get("conceded")} | '
                          f'{x.get("opponent")}'
                      )

                  print("Deplasman son 5:")
                  for x in away_last5:
                      print(
                          f'  {x.get("date")} | '
                          f'{x.get("scored")}-{x.get("conceded")} | '
                          f'{x.get("opponent")}'
                      )

                  checked += 1

                  if checked >= 5:
                      break

          print()
          print("Kontrol edilen maç:", checked)
          PY

      - name: 💾 Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/basketball.json

          if git diff --cached --quiet; then
            echo "Yeni veri yok."
          else
            git commit -m "Basketbol verileri güncellendi"
            git push
          fi
