name: Basketball Veri Güncelleme

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Repoyu indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri kur
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: EuroLeague maçlarını çek
        run: |
          python scraper.py

      - name: Geçmiş maçları çek
        run: |
          python history_scraper.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json history.json

          git diff --cached --quiet || git commit -m "Basketbol verilerini güncelle"

          git push
