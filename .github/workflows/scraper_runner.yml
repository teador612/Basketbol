name: Basketbol Veri Güncelleme

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basketbol-veri-guncelleme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Scraper çalıştır
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "========================================"
          echo "🏀 BASKETBOL SCRAPER"
          echo "========================================"
          date
          echo ""

          python -u scraper.py

      - name: Data kontrol
        run: |
          echo "========================================"
          echo "📦 DATA.JSON KONTROL"
          echo "========================================"

          if [ ! -f data.json ]; then
            echo "❌ data.json bulunamadı!"
            exit 1
          fi

          ls -lh data.json

          python - <<'PY'
          import json

          with open("data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("✅ JSON geçerli.")

          if isinstance(data, dict):
              for date, matches in data.items():
                  if isinstance(matches, list):
                      print(f"📅 {date}: {len(matches)} maç")
          PY
      - name: Debug dosyasını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iddaa-euroleague-debug
          path: iddaa-euroleague-debug.html
          if-no-files-found: ignore
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "ℹ️ Değişiklik yok."
          else
            git commit -m "Basketbol verilerini güncelle"
            git push
          fi
