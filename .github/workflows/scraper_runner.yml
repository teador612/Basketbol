name: Basketbol Veri Güncelleme

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Basketbol verilerini güncelle
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "========================================"
          echo "🏀 BASKETBOL VERİ GÜNCELLEME"
          echo "========================================"
          date
          echo ""

          python -u scraper.py

          echo ""
          echo "========================================"
          echo "✅ SCRAPER TAMAMLANDI"
          echo "========================================"

      - name: Veri kontrolü
        run: |
          echo "========================================"
          echo "📦 DATA.JSON KONTROL"
          echo "========================================"

          if [ ! -f data.json ]; then
            echo "❌ data.json oluşturulmadı!"
            exit 1
          fi

          ls -lh data.json

          python - <<'PY'
          import json

          with open("data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, list):
              print(f"📊 Maç sayısı: {len(data)}")
          elif isinstance(data, dict):
              print("📊 JSON obje olarak oluşturuldu.")
              print("🔑 Anahtarlar:", list(data.keys())[:20])
          else:
              print("⚠️ Beklenmeyen JSON yapısı:", type(data))
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "ℹ️ Değişiklik yok."
          else
            git commit -m "Basketbol verilerini güncelle"
            git push
          fi
