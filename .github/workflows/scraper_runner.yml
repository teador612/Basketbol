name: EuroLeague Basketbol Güncelleme
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
concurrency:
  group: euroleague-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Chromium kurulumu
        run: |
          python -m playwright install --with-deps chromium
      - name: EuroLeague verisini çek
        run: |
          python scraper.py
      - name: Debug dosyasını kontrol et
        if: always()
        run: |
          ls -lah
          if [ -f iddaa-rendered.txt ]; then
            echo "===== iddaa-rendered.txt ====="
            head -c 10000 iddaa-rendered.txt
          fi
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json iddaa-rendered.txt
          git diff --cached --quiet || git commit -m "EuroLeague verilerini güncelle"
      - name: Push
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
