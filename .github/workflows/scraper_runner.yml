name: EuroLeague Basketbol Güncelleme

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: euroleague-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chromium kurulumu
        run: |
          python -m playwright install --with-deps chromium

      - name: EuroLeague scraper
        run: |
          python scraper.py

      - name: Debug dosyalarını göster
        if: always()
        run: |
          echo "================ iddaa-rendered.txt ================"
          if [ -f iddaa-rendered.txt ]; then
            cat iddaa-rendered.txt
          else
            echo "Debug text yok"
          fi

      - name: Git durumunu kontrol et
        run: |
          git status

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json iddaa-rendered.html iddaa-rendered.txt

          git diff --cached --quiet || git commit -m "EuroLeague verilerini güncelle"

      - name: Güncel main ile birleştir
        run: |
          git pull --rebase origin main

      - name: Push
        run: |
          git push origin HEAD:main
