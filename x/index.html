<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Yanıt Temizleyici</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }
    .container {
      max-width: 520px;
      margin: auto;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }
    p {
      color: #aaa;
      line-height: 1.5;
    }
    .card {
      background: #16181c;
      border-radius: 18px;
      padding: 20px;
      margin-top: 18px;
    }
    .account {
      color: #1d9bf0;
      font-weight: 700;
    }
    .query {
      background: #08090a;
      border-radius: 10px;
      padding: 14px;
      margin: 14px 0;
      color: #5ecbff;
      word-break: break-all;
      font-family: monospace;
      font-size: 15px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 15px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary {
      background: #1d9bf0;
      color: white;
    }
    .secondary {
      background: #2f3336;
      color: white;
    }
    .info {
      color: #8fd3ff;
    }
    .warning {
      color: #ffd166;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🧹 X Yanıt Temizleyici</h1>
  <div class="card">
    <p>
      <span class="account">@mruldz</span>
      tarafından
      <span class="account">@PikaBey99</span>
      hesabına yazılan postları bul.
    </p>
    <div class="query">
      from:mruldz to:PikaBey99
    </div>
    <button
      class="primary"
      onclick="openSearch()">
      X'te Tweetleri Bul
    </button>
    <button
      class="secondary"
      onclick="copyQuery()">
      Arama Sorgusunu Kopyala
    </button>
  </div>
  <div class="card">
    <p class="info">
      Arama yalnızca <strong>@mruldz</strong> tarafından
      <strong>@PikaBey99</strong>'a gönderilen sonuçları hedefler.
    </p>
    <p class="warning">
      ⚠️ Silme işlemi X'in kendi menüsünden yapılır.
    </p>
  </div>
</div>
<script>
const QUERY = "from:mruldz to:PikaBey99";
function openSearch() {
  const url =
    "https://x.com/search?q=" +
    encodeURIComponent(QUERY) +
    "&src=typed_query&f=live";
  window.location.href = url;
}
async function copyQuery() {
  try {
    await navigator.clipboard.writeText(QUERY);
    alert("Arama sorgusu kopyalandı.");
  } catch (error) {
    prompt(
      "Sorguyu kopyala:",
      QUERY
    );
  }
}
</script>
</body>
</html>
