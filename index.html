<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Basketbol Tahmin Sistemi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f8;
      color: #18202a;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 7px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    .container {
      width: min(1100px, calc(100% - 24px));
      margin: 20px auto 40px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .stat-label {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 700;
    }

    .filters {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .filters-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    select,
    input {
      border: 1px solid #d5dbe3;
      border-radius: 9px;
      padding: 11px 12px;
      background: white;
      font-size: 14px;
      outline: none;
    }

    .section-title {
      font-size: 19px;
      font-weight: 700;
      margin: 20px 0 12px;
    }

    .match-list {
      display: grid;
      gap: 12px;
    }

    .match {
      background: white;
      border-radius: 15px;
      padding: 17px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .league {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
    }

    .date {
      color: #64748b;
      font-size: 12px;
    }

    .teams {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .prediction-box {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .prediction-item {
      background: #f8fafc;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .prediction-label {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 5px;
    }

    .prediction-value {
      font-size: 18px;
      font-weight: 700;
    }

    .over {
      color: #087f5b;
    }

    .under {
      color: #b42318;
    }

    .success {
      border-left: 5px solid #16a34a;
    }

    .failed {
      border-left: 5px solid #dc2626;
    }

    .push {
      border-left: 5px solid #f59e0b;
    }

    .pending {
      border-left: 5px solid #64748b;
    }

    .result {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid #e5e7eb;
      font-size: 13px;
      font-weight: 700;
    }

    .result.success-text {
      color: #15803d;
    }

    .result.failed-text {
      color: #b91c1c;
    }

    .result.push-text {
      color: #b45309;
    }

    .result.pending-text {
      color: #64748b;
    }

    .empty {
      background: white;
      padding: 35px 20px;
      border-radius: 14px;
      text-align: center;
      color: #64748b;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #64748b;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      padding: 20px;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .container {
        width: min(100% - 16px, 1100px);
      }

      header h1 {
        font-size: 21px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .stat {
        padding: 14px 8px;
      }

      .stat-value {
        font-size: 21px;
      }

      .prediction-box {
        grid-template-columns: 1fr;
      }

      .match {
        padding: 14px;
      }

      .teams {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏀 Basketbol Tahmin Sistemi</h1>
  <p>Ana tahmin: Maç Toplam Alt / Üst</p>
</header>

<main class="container">

  <section class="stats">

    <div class="stat">
      <div class="stat-label">Ana Başarı</div>
      <div class="stat-value" id="successRate">-</div>
    </div>

    <div class="stat">
      <div class="stat-label">Başarılı</div>
      <div class="stat-value" id="successful">-</div>
    </div>

    <div class="stat">
      <div class="stat-label">Başarısız</div>
      <div class="stat-value" id="failed">-</div>
    </div>

    <div class="stat">
      <div class="stat-label">Oynanan</div>
      <div class="stat-value" id="completed">-</div>
    </div>

  </section>

  <section class="filters">

    <div class="filters-row">

      <select id="dateFilter">
        <option value="all">Tüm tarihler</option>
      </select>

      <select id="leagueFilter">
        <option value="all">Tüm ligler</option>
        <option value="NBA">NBA</option>
        <option value="EuroLeague">EuroLeague</option>
      </select>

      <select id="statusFilter">
        <option value="all">Tüm maçlar</option>
        <option value="pending">Oynanmamış</option>
        <option value="played">Oynanmış</option>
        <option value="success">Başarılı</option>
        <option value="failed">Başarısız</option>
      </select>

    </div>

  </section>

  <div class="section-title">
    🏀 Maçlar
  </div>

  <div id="loading" class="loading">
    Veriler yükleniyor...
  </div>

  <div id="error"></div>

  <div id="matchList" class="match-list"></div>

</main>

<footer>
  Basketbol Tahmin Sistemi
</footer>

<script>
  const PREDICTIONS_URL =
    "predictions.json";

  const RESULTS_URL =
    "results.json";

  let predictions = [];
  let results = null;

  const dateFilter =
    document.getElementById("dateFilter");

  const leagueFilter =
    document.getElementById("leagueFilter");

  const statusFilter =
    document.getElementById("statusFilter");

  const matchList =
    document.getElementById("matchList");

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");


  // ==========================================================
  // VERİ YÜKLE
  // ==========================================================

  async function loadData() {

    try {

      loading.style.display = "block";
      errorBox.innerHTML = "";

      const cacheBust =
        "?v=" + Date.now();

      const [
        predictionsResponse,
        resultsResponse
      ] = await Promise.all([

        fetch(
          PREDICTIONS_URL + cacheBust,
          {
            cache: "no-store"
          }
        ),

        fetch(
          RESULTS_URL + cacheBust,
          {
            cache: "no-store"
          }
        )

      ]);

      if (!predictionsResponse.ok) {
        throw new Error(
          "predictions.json yüklenemedi."
        );
      }

      if (!resultsResponse.ok) {
        throw new Error(
          "results.json yüklenemedi."
        );
      }

      const predictionData =
        await predictionsResponse.json();

      results =
        await resultsResponse.json();

      predictions =
        predictionData.predictions || [];

      loading.style.display = "none";

      updateStats();

      buildDateFilter();

      renderMatches();

    } catch (error) {

      loading.style.display = "none";

      errorBox.innerHTML = `
        <div class="error">
          ❌ Veri yüklenemedi.<br><br>
          ${escapeHtml(error.message)}
        </div>
      `;
    }
  }


  // ==========================================================
  // İSTATİSTİK
  // ==========================================================

  function updateStats() {

    const overall =
      results?.statistics?.overall || {};

    const rate =
      overall.successRate;

    document.getElementById(
      "successRate"
    ).textContent =
      rate == null
        ? "-"
        : "%" + rate;

    document.getElementById(
      "successful"
    ).textContent =
      overall.successful ?? 0;

    document.getElementById(
      "failed"
    ).textContent =
      overall.failed ?? 0;

    document.getElementById(
      "completed"
    ).textContent =
      overall.completed ?? 0;
  }


  // ==========================================================
  // TARİH FİLTRESİ
  // ==========================================================

  function buildDateFilter() {

    const dates =
      [...new Set(
        predictions
          .map(item => item.date)
          .filter(Boolean)
      )]
      .sort();

    dateFilter.innerHTML = `
      <option value="all">
        Tüm tarihler
      </option>
    `;

    dates.forEach(date => {

      const option =
        document.createElement("option");

      option.value = date;
      option.textContent =
        formatDate(date);

      dateFilter.appendChild(option);
    });

    // Önce bugünün tarihini seç.
    const today =
      localDateString();

    if (dates.includes(today)) {
      dateFilter.value = today;
    }
  }


  // ==========================================================
  // MAÇLARI GÖSTER
  // ==========================================================

  function renderMatches() {

    const selectedDate =
      dateFilter.value;

    const selectedLeague =
      leagueFilter.value;

    const selectedStatus =
      statusFilter.value;

    let filtered =
      predictions.filter(item => {

        if (
          selectedDate !== "all" &&
          item.date !== selectedDate
        ) {
          return false;
        }

        if (
          selectedLeague !== "all" &&
          normalizeLeague(item.league)
            !== selectedLeague
        ) {
          return false;
        }

        const status =
          getMatchStatus(item);

        if (
          selectedStatus !== "all" &&
          status !== selectedStatus
        ) {
          return false;
        }

        return true;
      });

    filtered.sort((a, b) => {

      const aTime =
        new Date(
          a.utcDate ||
          a.date ||
          0
        ).getTime();

      const bTime =
        new Date(
          b.utcDate ||
          b.date ||
          0
        ).getTime();

      return aTime - bTime;
    });

    if (!filtered.length) {

      matchList.innerHTML = `
        <div class="empty">
          Bu filtrelere uygun maç bulunamadı.
        </div>
      `;

      return;
    }

    matchList.innerHTML =
      filtered
        .map(renderMatch)
        .join("");
  }


  // ==========================================================
  // MAÇ KARTI
  // ==========================================================

  function renderMatch(item) {

    const status =
      getMatchStatus(item);

    const statusClass =
      status === "success"
        ? "success"
        : status === "failed"
        ? "failed"
        : status === "played"
        ? "push"
        : "pending";

    const prediction =
      item.prediction || "-";

    const line =
      item.line ?? "-";

    const expected =
      item.expectedTotal ?? "-";

    const actualTotal =
      getActualTotal(item);

    const score =
      getScore(item);

    let resultHtml = "";

    if (status === "success") {

      resultHtml = `
        <div class="result success-text">
          ✅ Ana tahmin başarılı
          · Gerçek toplam: ${actualTotal}
        </div>
      `;

    } else if (status === "failed") {

      resultHtml = `
        <div class="result failed-text">
          ❌ Ana tahmin başarısız
          · Gerçek toplam: ${actualTotal}
        </div>
      `;

    } else if (
      item.played &&
      actualTotal !== null
    ) {

      resultHtml = `
        <div class="result push-text">
          ⏸️ Push
          · Gerçek toplam: ${actualTotal}
        </div>
      `;

    } else {

      resultHtml = `
        <div class="result pending-text">
          ⏳ Maç oynanmadı
        </div>
      `;
    }

    const predictionClass =
      prediction === "Üst"
        ? "over"
        : prediction === "Alt"
        ? "under"
        : "";

    return `
      <article class="match ${statusClass}">

        <div class="match-top">

          <div class="league">
            ${escapeHtml(
              normalizeLeague(item.league)
            )}
          </div>

          <div class="date">
            ${formatDateTime(
              item.utcDate ||
              item.date
            )}
          </div>

        </div>

        <div class="teams">
          ${escapeHtml(
            item.home || "-"
          )}
          <br>
          ${escapeHtml(
            item.away || "-"
          )}

          ${score
            ? `<br><span style="font-size:14px;color:#64748b">${score}</span>`
            : ""
          }
        </div>

        <div class="prediction-box">

          <div class="prediction-item">

            <div class="prediction-label">
              ANA TAHMİN
            </div>

            <div class="prediction-value ${predictionClass}">
              ${escapeHtml(
                prediction
              )}
            </div>

          </div>

          <div class="prediction-item">

            <div class="prediction-label">
              BAREM
            </div>

            <div class="prediction-value">
              ${line}
            </div>

          </div>

          <div class="prediction-item">

            <div class="prediction-label">
              BEKLENEN TOPLAM
            </div>

            <div class="prediction-value">
              ${expected}
            </div>

          </div>

        </div>

        ${resultHtml}

      </article>
    `;
  }


  // ==========================================================
  // DURUM
  // ==========================================================

  function getMatchStatus(item) {

    if (
      item.success === true
    ) {
      return "success";
    }

    if (
      item.success === false
    ) {
      return "failed";
    }

    if (
      item.played
    ) {
      return "played";
    }

    return "pending";
  }


  // ==========================================================
  // GERÇEK TOPLAM
  // ==========================================================

  function getActualTotal(item) {

    const home =
      Number(item.homeScore);

    const away =
      Number(item.awayScore);

    if (
      !Number.isFinite(home) ||
      !Number.isFinite(away)
    ) {
      return null;
    }

    return home + away;
  }


  // ==========================================================
  // SKOR
  // ==========================================================

  function getScore(item) {

    const home =
      Number(item.homeScore);

    const away =
      Number(item.awayScore);

    if (
      !Number.isFinite(home) ||
      !Number.isFinite(away)
    ) {
      return "";
    }

    return `${home} - ${away}`;
  }


  // ==========================================================
  // LİG
  // ==========================================================

  function normalizeLeague(league) {

    const value =
      String(league || "")
        .toUpperCase();

    if (
      value === "NBA"
    ) {
      return "NBA";
    }

    if (
      value === "E" ||
      value === "E2026" ||
      value === "EUROLEAGUE" ||
      value === "EUROPE"
    ) {
      return "EuroLeague";
    }

    return league || "Diğer";
  }


  // ==========================================================
  // TARİH
  // ==========================================================

  function localDateString() {

    const now =
      new Date();

    const year =
      now.getFullYear();

    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        now.getDate()
      ).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  function formatDate(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return value;
    }

    return date.toLocaleDateString(
      "tr-TR",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }
    );
  }


  function formatDateTime(value) {

    if (!value) {
      return "-";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return value;
    }

    return date.toLocaleString(
      "tr-TR",
      {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  // ==========================================================
  // HTML GÜVENLİĞİ
  // ==========================================================

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  // ==========================================================
  // FİLTRELER
  // ==========================================================

  dateFilter.addEventListener(
    "change",
    renderMatches
  );

  leagueFilter.addEventListener(
    "change",
    renderMatches
  );

  statusFilter.addEventListener(
    "change",
    renderMatches
  );


  // ==========================================================
  // BAŞLAT
  // ==========================================================

  loadData();
</script>

</body>
</html>
