<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Basketbol Tahmin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #0b0f14;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0b0f14;
      color: #e8edf3;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      font-size: 13px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 10px;
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .subtitle {
      margin-top: 2px;
      color: #7f8a98;
      font-size: 10px;
    }

    /* SUMMARY */

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .summary-card {
      background: #121820;
      border: 1px solid #202a35;
      border-radius: 8px;
      padding: 7px 5px;
      text-align: center;
    }

    .summary-value {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    .summary-label {
      margin-top: 2px;
      font-size: 9px;
      color: #7f8a98;
    }

    /* FILTERS */

    .filters {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 9px;
    }

    .filter {
      min-width: 0;
    }

    .filter label {
      display: block;
      margin: 0 0 3px 2px;
      color: #778392;
      font-size: 9px;
      font-weight: 700;
    }

    .filter input,
    .filter select {
      width: 100%;
      min-height: 34px;
      padding: 6px 8px;
      border: 1px solid #283441;
      border-radius: 7px;
      background: #111820;
      color: #e8edf3;
      outline: none;
    }

    .filter input:focus,
    .filter select:focus {
      border-color: #526b84;
    }

    input[type="date"] {
      color-scheme: dark;
    }

    /* STATUS */

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 7px 1px;
      color: #7f8a98;
      font-size: 10px;
    }

    .status-count {
      color: #aeb8c4;
      font-weight: 700;
    }

    /* MATCH LIST */

    .matches {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .match-card {
      overflow: hidden;
      border: 1px solid #202a35;
      border-radius: 8px;
      background: #11171e;
      transition:
        border-color 0.15s ease,
        background 0.15s ease;
    }

    .match-card:hover {
      border-color: #334353;
    }

    .match-head {
      width: 100%;
      min-height: 58px;
      padding: 7px 9px;
      display: grid;
      grid-template-columns: 45px 1fr auto;
      gap: 7px;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .match-time {
      text-align: center;
      color: #7d8996;
      font-size: 9px;
      line-height: 1.2;
    }

    .match-time strong {
      display: block;
      margin-bottom: 2px;
      color: #aeb8c4;
      font-size: 10px;
    }

    .teams {
      min-width: 0;
    }

    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      line-height: 1.35;
    }

    .team-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #e9edf2;
      font-size: 11px;
      font-weight: 700;
    }

    .score {
      flex: 0 0 auto;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
    }

    .score.empty {
      color: #596574;
    }

    .prediction-box {
      min-width: 74px;
      text-align: right;
    }

    .prediction-market {
      color: #737f8c;
      font-size: 8px;
      margin-bottom: 2px;
    }

    .prediction {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .prediction.over {
      background: #153626;
      color: #65df9a;
    }

    .prediction.under {
      background: #302c18;
      color: #e3c55e;
    }

    .prediction.pending {
      background: #202730;
      color: #929dab;
    }

    .prediction.push {
      background: #30281d;
      color: #e0ad55;
    }

    .prediction.fail {
      background: #361d22;
      color: #ef7e89;
    }

    .prediction.success {
      background: #153626;
      color: #65df9a;
    }

    .expand-icon {
      margin-left: 4px;
      color: #566372;
      font-size: 12px;
      transition: transform 0.15s ease;
    }

    .match-card.open .expand-icon {
      transform: rotate(180deg);
    }

    /* DETAILS */

    .details {
      display: none;
      padding: 0 9px 9px;
      border-top: 1px solid #1d2630;
      background: #0e141a;
    }

    .match-card.open .details {
      display: block;
    }

    .detail-top {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin: 7px 0;
    }

    .detail-box {
      padding: 6px;
      border: 1px solid #202a35;
      border-radius: 6px;
      background: #121920;
      text-align: center;
    }

    .detail-label {
      color: #707c89;
      font-size: 8px;
      margin-bottom: 2px;
    }

    .detail-value {
      color: #e8edf3;
      font-size: 11px;
      font-weight: 800;
    }

    /* PERIODS */

    .period-title {
      margin: 8px 0 5px;
      color: #9ca8b5;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .period-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }

    .period-card {
      min-width: 0;
      padding: 6px 3px;
      border: 1px solid #202a35;
      border-radius: 6px;
      background: #121920;
      text-align: center;
    }

    .period-name {
      color: #707c89;
      font-size: 8px;
      margin-bottom: 3px;
    }

    .period-line {
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
    }

    .period-prediction {
      margin-top: 2px;
      color: #8f9aa7;
      font-size: 8px;
      font-weight: 700;
    }

    /* HISTORY */

    .history-row {
      display: grid;
      grid-template-columns: 1fr 48px 48px;
      gap: 5px;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid #1a222b;
      font-size: 9px;
    }

    .history-row:last-child {
      border-bottom: 0;
    }

    .history-team {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #9aa5b1;
    }

    .history-score {
      text-align: center;
      color: #d7dde4;
      font-weight: 700;
    }

    .history-total {
      text-align: right;
      color: #8a96a4;
    }

    /* EMPTY */

    .empty {
      padding: 25px 12px;
      border: 1px solid #202a35;
      border-radius: 8px;
      background: #11171e;
      text-align: center;
      color: #7d8996;
      font-size: 11px;
    }

    .loading {
      padding: 20px;
      text-align: center;
      color: #7d8996;
      font-size: 11px;
    }

    .error {
      padding: 12px;
      border: 1px solid #4a252b;
      border-radius: 8px;
      background: #24151a;
      color: #ef8c96;
      font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 560px) {
      .container {
        padding: 8px;
      }

      .summary {
        gap: 4px;
      }

      .summary-card {
        padding: 6px 3px;
      }

      .summary-value {
        font-size: 14px;
      }

      .summary-label {
        font-size: 8px;
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .filter:first-child {
        grid-column: 1 / -1;
      }

      .match-head {
        grid-template-columns: 39px 1fr auto;
        padding: 6px 7px;
      }

      .team-name {
        font-size: 10px;
      }

      .score {
        font-size: 11px;
      }

      .prediction-box {
        min-width: 68px;
      }

      .prediction {
        min-width: 59px;
        font-size: 9px;
      }

      .period-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    @media (max-width: 360px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .filter:first-child {
        grid-column: auto;
      }

      .period-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <div class="title">🏀 Basketbol Tahmin</div>
      <div class="subtitle">Maç toplam Alt / Üst</div>
    </div>
  </div>

  <div class="summary">

    <div class="summary-card">
      <div class="summary-value" id="successRate">-</div>
      <div class="summary-label">Başarı</div>
    </div>

    <div class="summary-card">
      <div class="summary-value" id="successful">-</div>
      <div class="summary-label">Başarılı</div>
    </div>

    <div class="summary-card">
      <div class="summary-value" id="failed">-</div>
      <div class="summary-label">Başarısız</div>
    </div>

    <div class="summary-card">
      <div class="summary-value" id="completed">-</div>
      <div class="summary-label">Biten</div>
    </div>

  </div>

  <div class="filters">

    <div class="filter">
      <label for="dateFilter">Tarih</label>

      <input
        type="date"
        id="dateFilter"
      >
    </div>

    <div class="filter">
      <label for="leagueFilter">Lig</label>

      <select id="leagueFilter">
        <option value="all">Tüm ligler</option>
        <option value="NBA">NBA</option>
        <option value="EuroLeague">EuroLeague</option>
      </select>
    </div>

    <div class="filter">
      <label for="statusFilter">Durum</label>

      <select id="statusFilter">
        <option value="all">Tümü</option>
        <option value="pending">Oynanmamış</option>
        <option value="success">Başarılı</option>
        <option value="failed">Başarısız</option>
        <option value="push">Push</option>
      </select>
    </div>

  </div>

  <div class="status-line">
    <span id="dateTitle">Maçlar</span>

    <span
      class="status-count"
      id="matchCount"
    >
      0 maç
    </span>
  </div>

  <div id="content">
    <div class="loading">
      Veriler yükleniyor...
    </div>
  </div>

</div>

<script>
"use strict";

/* =========================================================
   AYARLAR
========================================================= */

const CACHE_KEY = "?v=" + Date.now();

const PREDICTIONS_URL =
  "./predictions.json" + CACHE_KEY;

const RESULTS_URL =
  "./results.json" + CACHE_KEY;


/* =========================================================
   GLOBAL
========================================================= */

let predictions = [];
let resultsMap = {};

let statistics = {
  completed: 0,
  successful: 0,
  failed: 0,
  push: 0,
  successRate: null
};


/* =========================================================
   DOM
========================================================= */

const dateFilter =
  document.getElementById("dateFilter");

const leagueFilter =
  document.getElementById("leagueFilter");

const statusFilter =
  document.getElementById("statusFilter");

const content =
  document.getElementById("content");

const matchCount =
  document.getElementById("matchCount");

const dateTitle =
  document.getElementById("dateTitle");

const successRate =
  document.getElementById("successRate");

const successful =
  document.getElementById("successful");

const failed =
  document.getElementById("failed");

const completed =
  document.getElementById("completed");


/* =========================================================
   YARDIMCI
========================================================= */

function normalizeDate(value) {

  if (!value) {
    return "";
  }

  const text =
    String(value).trim();

  if (
    /^\d{4}-\d{2}-\d{2}$/.test(text)
  ) {
    return text;
  }

  const match =
    text.match(
      /^(\d{4})-(\d{2})-(\d{2})/
    );

  if (match) {

    return (
      match[1] +
      "-" +
      match[2] +
      "-" +
      match[3]
    );
  }

  return "";
}


function formatDate(date) {

  if (!date) {
    return "-";
  }

  const parts =
    date.split("-");

  if (parts.length !== 3) {
    return date;
  }

  return (
    parts[2] +
    "." +
    parts[1] +
    "." +
    parts[0]
  );
}


function todayString() {

  const now =
    new Date();

  const y =
    now.getFullYear();

  const m =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");

  const d =
    String(
      now.getDate()
    ).padStart(2, "0");

  return (
    y +
    "-" +
    m +
    "-" +
    d
  );
}


function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;
}


function formatNumber(value, digits = 1) {

  const n =
    number(value);

  if (n === null) {
    return "-";
  }

  return n.toFixed(digits);
}


function getPredictionDate(p) {

  return normalizeDate(
    p.date ??
    p.utcDate
  );
}


function getHomeName(p) {

  return (
    p.home ??
    p.homeTeam ??
    "-"
  );
}


function getAwayName(p) {

  return (
    p.away ??
    p.awayTeam ??
    "-"
  );
}


/* =========================================================
   RESULT
========================================================= */

function resultForPrediction(p) {

  const id =
    String(
      p.id ?? ""
    );

  if (
    resultsMap[id]
  ) {
    return resultsMap[id];
  }

  return null;
}


function normalizeStatus(status) {

  if (!status) {
    return "";
  }

  const text =
    String(status)
      .toLowerCase()
      .trim();

  if (
    text === "successful" ||
    text === "success" ||
    text === "won" ||
    text === "win"
  ) {
    return "success";
  }

  if (
    text === "failed" ||
    text === "fail" ||
    text === "lost" ||
    text === "loss"
  ) {
    return "failed";
  }

  if (
    text === "push" ||
    text === "draw"
  ) {
    return "push";
  }

  if (
    text === "pending" ||
    text === "notplayed" ||
    text === "not_played" ||
    text === "not played"
  ) {
    return "pending";
  }

  return "";
}


function getStatus(p) {

  const result =
    resultForPrediction(p);

  if (
    result &&
    result.status
  ) {

    const status =
      normalizeStatus(
        result.status
      );

    if (status) {
      return status;
    }
  }

  if (
    p.played !== true
  ) {
    return "pending";
  }

  if (
    p.success === true
  ) {
    return "success";
  }

  if (
    p.success === false
  ) {
    return "failed";
  }

  if (
    String(
      p.result ?? ""
    ).toLowerCase() === "push"
  ) {
    return "push";
  }

  const homeScore =
    number(p.homeScore);

  const awayScore =
    number(p.awayScore);

  const line =
    number(p.line);

  if (
    homeScore !== null &&
    awayScore !== null &&
    line !== null
  ) {

    const total =
      homeScore +
      awayScore;

    if (
      total === line
    ) {
      return "push";
    }

    const actual =
      total > line
        ? "üst"
        : "alt";

    const predicted =
      String(
        p.prediction ?? ""
      ).toLowerCase();

    return actual === predicted
      ? "success"
      : "failed";
  }

  return "pending";
}


function statusText(status) {

  if (status === "success") {
    return "✓ Başarılı";
  }

  if (status === "failed") {
    return "✕ Başarısız";
  }

  if (status === "push") {
    return "＝ Push";
  }

  return "Bekliyor";
}


/* =========================================================
   PREDICTION
========================================================= */

function predictionClass(
  prediction,
  status
) {

  if (
    status === "success"
  ) {
    return "success";
  }

  if (
    status === "failed"
  ) {
    return "fail";
  }

  if (
    status === "push"
  ) {
    return "push";
  }

  const text =
    String(
      prediction ?? ""
    ).toLowerCase();

  if (
    text === "üst"
  ) {
    return "over";
  }

  if (
    text === "alt"
  ) {
    return "under";
  }

  return "pending";
}


function predictionText(p) {

  const prediction =
    String(
      p.prediction ?? ""
    ).trim();

  const line =
    number(p.line);

  if (!prediction) {
    return "Tahmin yok";
  }

  if (line === null) {
    return prediction;
  }

  return (
    prediction +
    " " +
    line
  );
}


/* =========================================================
   PERIODLAR
========================================================= */

function getPeriodData(
  p,
  key
) {

  const data =
    p[key];

  if (!data) {
    return null;
  }

  if (
    typeof data !== "object"
  ) {
    return null;
  }

  return data;
}


function getPeriodLine(
  p,
  key
) {

  const data =
    getPeriodData(
      p,
      key
    );

  if (!data) {
    return null;
  }

  return (
    number(data.line) ??
    number(data.barem)
  );
}


function getPeriodPrediction(
  p,
  key
) {

  const data =
    getPeriodData(
      p,
      key
    );

  if (!data) {
    return "";
  }

  return String(
    data.prediction ??
    data.result ??
    ""
  );
}


function periodCard(
  title,
  p,
  key
) {

  const line =
    getPeriodLine(
      p,
      key
    );

  const prediction =
    getPeriodPrediction(
      p,
      key
    );

  return `
    <div class="period-card">

      <div class="period-name">
        ${escapeHtml(title)}
      </div>

      <div class="period-line">
        ${
          line !== null
            ? escapeHtml(line)
            : "-"
        }
      </div>

      <div class="period-prediction">
        ${
          prediction
            ? escapeHtml(prediction)
            : "-"
        }
      </div>

    </div>
  `;
}


function getFirstHalfData(p) {

  const value =
    p.firstHalfTotal ??
    p.firstHalf ??
    null;

  if (
    !value ||
    typeof value !== "object"
  ) {
    return null;
  }

  return value;
}


function buildPeriodSection(p) {

  const firstHalf =
    getFirstHalfData(p);

  const firstHalfLine =
    firstHalf
      ? (
          number(firstHalf.line) ??
          number(firstHalf.barem)
        )
      : null;

  const firstHalfPrediction =
    firstHalf
      ? String(
          firstHalf.prediction ??
          firstHalf.result ??
          ""
        )
      : "";

  return `
    <div class="period-title">
      Periyot baremleri
    </div>

    <div class="period-grid">

      <div class="period-card">

        <div class="period-name">
          Maç
        </div>

        <div class="period-line">
          ${
            number(p.line) !== null
              ? escapeHtml(p.line)
              : "-"
          }
        </div>

        <div class="period-prediction">
          ${escapeHtml(
            p.prediction ?? "-"
          )}
        </div>

      </div>

      <div class="period-card">

        <div class="period-name">
          İY
        </div>

        <div class="period-line">
          ${
            firstHalfLine !== null
              ? escapeHtml(firstHalfLine)
              : "-"
          }
        </div>

        <div class="period-prediction">
          ${
            firstHalfPrediction
              ? escapeHtml(
                  firstHalfPrediction
                )
              : "-"
          }
        </div>

      </div>

      ${periodCard(
        "Q1",
        p,
        "q1"
      )}

      ${periodCard(
        "Q2",
        p,
        "q2"
      )}

      ${periodCard(
        "Q3",
        p,
        "q3"
      )}

      ${periodCard(
        "Q4",
        p,
        "q4"
      )}

    </div>
  `;
}


/* =========================================================
   GEÇMİŞ MAÇLAR
========================================================= */

function buildHistory(
  title,
  history
) {

  if (
    !Array.isArray(history) ||
    history.length === 0
  ) {
    return "";
  }

  const rows =
    history
      .slice(0, 5)
      .map(item => {

        const scored =
          number(item.scored);

        const conceded =
          number(item.conceded);

        const total =
          scored !== null &&
          conceded !== null
            ? scored + conceded
            : null;

        return `
          <div class="history-row">

            <div class="history-team">
              ${escapeHtml(
                item.opponent ??
                "-"
              )}
            </div>

            <div class="history-score">
              ${
                scored !== null &&
                conceded !== null
                  ? (
                      scored +
                      " - " +
                      conceded
                    )
                  : "-"
              }
            </div>

            <div class="history-total">
              ${
                total !== null
                  ? total
                  : "-"
              }
            </div>

          </div>
        `;
      })
      .join("");

  return `
    <div class="period-title">
      ${escapeHtml(title)}
    </div>

    ${rows}
  `;
}


/* =========================================================
   DETAY
========================================================= */

function buildDetails(p) {

  const expected =
    number(
      p.expectedTotal
    );

  const homeExpected =
    number(
      p.expectedHome
    );

  const awayExpected =
    number(
      p.expectedAway
    );

  const homeSample =
    number(
      p.homeSample
    );

  const awaySample =
    number(
      p.awaySample
    );

  const homeTotalAverage =
    number(
      p.homeTotalAverage
    );

  const awayTotalAverage =
    number(
      p.awayTotalAverage
    );

  return `
    <div class="details">

      <div class="detail-top">

        <div class="detail-box">

          <div class="detail-label">
            Maç baremi
          </div>

          <div class="detail-value">
            ${
              number(p.line) !== null
                ? escapeHtml(p.line)
                : "-"
            }
          </div>

        </div>

        <div class="detail-box">

          <div class="detail-label">
            Beklenen
          </div>

          <div class="detail-value">
            ${
              expected !== null
                ? expected.toFixed(1)
                : "-"
            }
          </div>

        </div>

        <div class="detail-box">

          <div class="detail-label">
            Güven
          </div>

          <div class="detail-value">
            ${
              number(p.confidence) !== null
                ? "%" +
                  Math.round(
                    p.confidence
                  )
                : "-"
            }
          </div>

        </div>

      </div>


      <div class="detail-top">

        <div class="detail-box">

          <div class="detail-label">
            Ev beklenen
          </div>

          <div class="detail-value">
            ${
              homeExpected !== null
                ? homeExpected.toFixed(1)
                : "-"
            }
          </div>

        </div>

        <div class="detail-box">

          <div class="detail-label">
            Deplasman beklenen
          </div>

          <div class="detail-value">
            ${
              awayExpected !== null
                ? awayExpected.toFixed(1)
                : "-"
            }
          </div>

        </div>

        <div class="detail-box">

          <div class="detail-label">
            Örneklem
          </div>

          <div class="detail-value">
            ${
              homeSample !== null
                ? homeSample
                : "-"
            }
            /
            ${
              awaySample !== null
                ? awaySample
                : "-"
            }
          </div>

        </div>

      </div>


      <div class="detail-top">

        <div class="detail-box">

          <div class="detail-label">
            Ev son 5 toplam
          </div>

          <div class="detail-value">
            ${
              homeTotalAverage !== null
                ? homeTotalAverage.toFixed(1)
                : "-"
            }
          </div>

        </div>

        <div class="detail-box">

          <div class="detail-label">

          </div>

          <div class="detail-value">

                ? awayTotalAverage.toFixed(1)
                : "-"
            }

        <div class="detail-box">

          <div class="detail-label">

          </div>

          <div class="detail-value">
            ${
              number(p.actualTotal) !== null
                ? p.actualTotal
                : (

                        )

            }
          </div>

      </div>


      ${buildPeriodSection(p)}


      ${

        )

/* =========================================================
   MAÇ KARTI
========================================================= */

function createMatchCard(p) {

  const status =
    getStatus(p);

  const home =
    getHomeName(p);

  const away =
    getAwayName(p);

  const homeScore =
    number(
      p.homeScore
    );

  const awayScore =
    number(
      p.awayScore
    );

  const hasScore =
    homeScore !== null &&
    awayScore !== null;

  const predictionClassName =
    predictionClass(
      p.prediction,
      status
    );

  const predictionLabel =
    predictionText(p);

  const statusLabel =
    statusText(status);

  const league =
    p.league ??
    "";

  let time =
    p.time ??
    "";

  if (!time && p.utcDate) {

    const date =
      new Date(
        p.utcDate
      );

    if (
      !Number.isNaN(
        date.getTime()
      )
    ) {
      time =
        date.toLocaleTimeString(
          "tr-TR",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );
    }
  }

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "match-card";

  card.dataset.id =
    String(
      p.id ?? ""
    );

  card.innerHTML = `

    <div
      class="match-head"
      role="button"
      tabindex="0"
      aria-expanded="false"
    >

      <div class="match-time">

        <strong>
          ${
            time
              ? escapeHtml(time)
              : "🏀"
          }
        </strong>

        <span>
          ${escapeHtml(
            league
          )}
        </span>

      </div>


      <div class="teams">

        <div class="team-row">

          <span class="team-name">
            ${escapeHtml(home)}
          </span>

          <span
            class="score ${
              hasScore
                ? ""
                : "empty"
            }"
          >
            ${
              hasScore
                ? homeScore
                : "-"
            }
          </span>

        </div>


        <div class="team-row">

          <span class="team-name">
            ${escapeHtml(away)}
          </span>

          <span
            class="score ${
              hasScore
                ? ""
                : "empty"
            }"
          >
            ${
              hasScore
                ? awayScore
                : "-"
            }
          </span>

        </div>

      </div>


      <div class="prediction-box">

        <div class="prediction-market">
          ${escapeHtml(
            statusLabel
          )}
        </div>

        <div
          class="prediction ${predictionClassName}"
        >
          ${escapeHtml(
            predictionLabel
          )}
        </div>

        <span class="expand-icon">
          ▼
        </span>

      </div>

    </div>


    ${buildDetails(p)}

  `;


  const head =
    card.querySelector(
      ".match-head"
    );


  function toggle() {

    const open =
      card.classList.toggle(
        "open"
      );

    head.setAttribute(
      "aria-expanded",
      open
        ? "true"
        : "false"
    );
  }


  head.addEventListener(
    "click",
    toggle
  );


  head.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" ||
        event.key === " "
      ) {

        event.preventDefault();

        toggle();
      }

    }
  );


  return card;
}


/* =========================================================
   TARİHLER
========================================================= */

function getAvailableDates() {

  return [
    ...new Set(
      predictions
        .map(
          getPredictionDate
        )
        .filter(Boolean)
    )
  ].sort();
}


function setDefaultDate() {

  const dates =
    getAvailableDates();

  if (
    dates.length === 0
  ) {
    dateFilter.value = "";
    return;
  }

  const today =
    todayString();

  /*
   * Bugün varsa bugün seç.
   *
   * Bugün henüz veri yoksa:
   * bugünden sonraki ilk tarihi,
   * o da yoksa en son tarihi seç.
   */

  if (
    dates.includes(today)
  ) {

    dateFilter.value =
      today;

    return;
  }


  const futureDates =
    dates.filter(
      date =>
        date >= today
    );


  if (
    futureDates.length > 0
  ) {

    dateFilter.value =
      futureDates[0];

    return;
  }


  dateFilter.value =
    dates[dates.length - 1];
}


/* =========================================================
   FİLTRE
========================================================= */

function filteredPredictions() {

  const selectedDate =
    dateFilter.value;

  const selectedLeague =
    leagueFilter.value;

  const selectedStatus =
    statusFilter.value;


  return predictions.filter(
    p => {

      const date =
        getPredictionDate(p);

      if (
        selectedDate &&
        date !== selectedDate
      ) {
        return false;
      }


      if (
        selectedLeague !== "all"
      ) {

        const league =
          String(
            p.league ?? ""
          ).toLowerCase();

        const wanted =
          selectedLeague.toLowerCase();

        if (
          league !== wanted
        ) {
          return false;
        }
      }


      if (
        selectedStatus !== "all"
      ) {

        const status =
          getStatus(p);

        if (
          status !== selectedStatus
        ) {
          return false;
        }
      }


      return true;
    }
  );
}


/* =========================================================
   ÖZET
========================================================= */

function calculateSummary() {

  let completedCount = 0;
  let successfulCount = 0;
  let failedCount = 0;
  let pushCount = 0;


  predictions.forEach(
    p => {

      const status =
        getStatus(p);

      if (
        status === "success"
      ) {

        completedCount++;
        successfulCount++;

      } else if (
        status === "failed"
      ) {

        completedCount++;
        failedCount++;

      } else if (
        status === "push"
      ) {

        completedCount++;
        pushCount++;
      }

    }
  );


  const denominator =
    successfulCount +
    failedCount;


  const rate =
    denominator > 0
      ? (
          successfulCount /
          denominator *
          100
        )
      : null;


  statistics = {
    completed:
      completedCount,

    successful:
      successfulCount,

    failed:
      failedCount,

    push:
      pushCount,

    successRate:
      rate
  };


  /*
   * results.json içindeki gerçek istatistik
   * varsa onu kullan.
   */

  const overall =
    window.__RESULTS_OVERALL__;

  if (
    overall &&
    typeof overall === "object"
  ) {

    if (
      number(overall.completed) !== null
    ) {
      statistics.completed =
        number(
          overall.completed
        );
    }

    if (
      number(overall.successful) !== null
    ) {
      statistics.successful =
        number(
          overall.successful
        );
    }

    if (
      number(overall.failed) !== null
    ) {
      statistics.failed =
        number(
          overall.failed
        );
    }

    if (
      number(overall.push) !== null
    ) {
      statistics.push =
        number(
          overall.push
        );
    }

    if (
      number(overall.successRate) !== null
    ) {
      statistics.successRate =
        number(
          overall.successRate
        );
    }
  }


  successRate.textContent =
    statistics.successRate !== null
      ? "%" +
        Number(
          statistics.successRate
        ).toFixed(2)
      : "-";


  successful.textContent =
    statistics.successful;


  failed.textContent =
    statistics.failed;


  completed.textContent =
    statistics.completed;
}


/* =========================================================
   RENDER
========================================================= */

function render() {

  const list =
    filteredPredictions();


  matchCount.textContent =
    list.length +
    " maç";


  const selectedDate =
    dateFilter.value;


  if (
    selectedDate
  ) {

    dateTitle.textContent =
      formatDate(
        selectedDate
      );

  } else {

    dateTitle.textContent =
      "Tüm tarihler";
  }


  content.innerHTML = "";


  if (
    list.length === 0
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "empty";

    empty.textContent =
      selectedDate
        ? (
            formatDate(
              selectedDate
            ) +
            " tarihinde maç bulunamadı."
          )
        : "Maç bulunamadı.";

    content.appendChild(
      empty
    );

    return;
  }


  const matches =
    document.createElement(
      "div"
    );

  matches.className =
    "matches";


  /*
   * Tarih + saat sıralaması
   */

  list.sort(
    (a, b) => {

      const aDate =
        a.utcDate ??
        a.date ??
        "";

      const bDate =
        b.utcDate ??
        b.date ??
        "";

      return String(
        aDate
      ).localeCompare(
        String(
          bDate
        )
      );
    }
  );


  list.forEach(
    p => {

      matches.appendChild(
        createMatchCard(p)
      );

    }
  );


  content.appendChild(
    matches
  );
}


/* =========================================================
   PREDICTIONS JSON
========================================================= */

async function loadPredictions() {

  const response =
    await fetch(
      PREDICTIONS_URL,
      {
        cache: "no-store"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "predictions.json yüklenemedi. HTTP " +
      response.status
    );
  }


  const data =
    await response.json();


  /*
   * Beklenen:
   *
   * {
   *   predictions: [...]
   * }
   *
   * Eski/alternatif yapı:
   *
   * [...]
   */

  if (
    Array.isArray(data)
  ) {

    predictions =
      data;

  } else if (
    Array.isArray(
      data.predictions
    )
  ) {

    predictions =
      data.predictions;

  } else {

    predictions =
      [];
  }


  /*
   * Sadece geçerli maç kayıtları
   */

  predictions =
    predictions.filter(
      p =>
        p &&
        typeof p === "object"
    );
}


/* =========================================================
   RESULTS JSON
========================================================= */

async function loadResults() {

  try {

    const response =
      await fetch(
        RESULTS_URL,
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {
      return;
    }


    const data =
      await response.json();


    /*
     * results.json yapısı:
     *
     * {
     *   statistics: {...},
     *   results: [...]
     * }
     */


    if (
      data &&
      data.statistics &&
      data.statistics.overall
    ) {

      window.__RESULTS_OVERALL__ =
        data.statistics.overall;
    }


    let list = [];


    if (
      Array.isArray(data)
    ) {

      list =
        data;

    } else if (
      data &&
      Array.isArray(
        data.results
      )
    ) {

      list =
        data.results;
    }


    resultsMap = {};


    list.forEach(
      result => {

        if (
          !result ||
          result.id === undefined ||
          result.id === null
        ) {
          return;
        }


        resultsMap[
          String(result.id)
        ] =
          result;
      }
    );

  } catch (
    error
  ) {

    /*
     * results.json bulunamazsa
     * predictions.json yine çalışır.
     */

    console.warn(
      "results.json yüklenemedi:",
      error
    );

    resultsMap = {};
  }
}


/* =========================================================
   ANA YÜKLEME
========================================================= */

async function loadData() {

  try {

    content.innerHTML = `
      <div class="loading">
        Veriler yükleniyor...
      </div>
    `;


    await loadPredictions();

    await loadResults();


    if (
      predictions.length === 0
    ) {

      content.innerHTML = `
        <div class="empty">
          predictions.json içinde maç bulunamadı.
        </div>
      `;

      calculateSummary();

      return;
    }


    setDefaultDate();

    calculateSummary();

    render();


  } catch (
    error
  ) {

    console.error(
      error
    );


    content.innerHTML = `
      <div class="error">
        <strong>Veriler yüklenemedi.</strong>
        <br><br>
        ${escapeHtml(
          error.message
        )}
      </div>
    `;

  }

}


/* =========================================================
   EVENTLER
========================================================= */

dateFilter.addEventListener(
  "change",
  render
);


leagueFilter.addEventListener(
  "change",
  render
);


statusFilter.addEventListener(
  "change",
  render
);


/* =========================================================
   BAŞLAT
========================================================= */

loadData();

</script>
