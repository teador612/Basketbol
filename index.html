<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketbol Analiz Masası</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #0b0e11; color: #fff; padding: 20px; }

        .container { max-width: 1200px; margin: 0 auto; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-title { color: #fff; font-size: 20px; font-weight: bold; }

        /* YENİLENEN TAKVİM SEÇİCİ ALANI */
        .date-picker-container {
            display: flex;
            align-items: center;
            background-color: #12161a;
            border: 1px solid #1e2329;
            border-radius: 8px;
            padding: 6px 12px;
            gap: 10px;
        }

        .date-btn {
            background: none;
            border: none;
            color: #848e9c;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .date-btn:hover { background-color: #181d22; color: #fff; }

        .date-input-wrapper {
            display: flex;
            align-items: center;
            background-color: #181d22;
            border: 1px solid #2b313a;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
        }

        .calendar-icon {
            font-size: 14px;
            margin-right: 6px;
        }

        input[type="date"] {
            background: transparent;
            border: none;
            color: #38d39f;
            font-weight: bold;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        /* Takvim simgesine tıklanınca takvimi zorla açan stil ayarları */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.8) sepia(100%) saturate(1000%) hue-rotate(100deg);
        }

        /* KART GRID YAPISI */
        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .match-card {
            background-color: #12161a;
            border: 1px solid #1e2329;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .match-card:hover { border-color: #38d39f; transform: translateY(-2px); }

        .card-header { display: flex; justify-content: space-between; color: #848e9c; font-size: 11px; font-weight: 600; margin-bottom: 12px; }
        .teams-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .team-line { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; }

        .totals-row {
            display: flex;
            justify-content: space-between;
            background-color: #181d22;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #2b313a;
        }

        .total-item { text-align: center; }
        .total-item .label { color: #848e9c; font-size: 10px; font-weight: bold; }
        .total-item .val { font-size: 18px; font-weight: bold; margin-top: 2px; }
        .highlight { color: #38d39f; }

        /* MODAL DETAY PANELİ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none; justify-content: center; align-items: center; padding: 20px;
            z-index: 999;
        }

        .modal-content {
            background-color: #12161a; border: 1px solid #1e2329;
            border-radius: 8px; width: 100%; max-width: 800px; padding: 24px;
            position: relative;
        }

        .close-btn { position: absolute; top: 15px; right: 20px; color: #848e9c; font-size: 24px; cursor: pointer; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
        .box { background: #181d22; border: 1px solid #2b313a; padding: 12px; border-radius: 6px; text-align: center; }
        .box-title { color: #848e9c; font-size: 11px; font-weight: bold; }
        .box-val { font-size: 24px; font-weight: bold; margin: 4px 0; }
        .section-title { color: #848e9c; font-size: 11px; font-weight: bold; margin: 20px 0 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="page-title">Analiz Edilen Maçlar</div>
        
        <!-- TIKLAYINCA TAKVİM AÇILAN ALAN -->
        <div class="date-picker-container">
            <button class="date-btn" onclick="changeDate(-1)">&lt;</button>
            <div class="date-input-wrapper" onclick="openCalendarPicker()">
                <span class="calendar-icon">📅</span>
                <input type="date" id="match-date" onchange="onDateChange()">
            </div>
            <button class="date-btn" onclick="changeDate(1)">&gt;</button>
        </div>
    </div>

    <!-- Maçların Dizildiği Grid -->
    <div class="match-grid" id="match-grid"></div>
</div>

<!-- Modal / Detay Ekranı -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div style="color:#848e9c; font-size:12px; font-weight:bold;" id="m-league"></div>
        <h2 style="margin: 8px 0 20px 0;" id="m-teams"></h2>

        <div class="section-title">BASKETBOL MAÇ ANALİZİ</div>
        <div class="grid-3">
            <div class="box"><div class="box-title">1. PERİYOT</div><div class="box-val" id="m-q1"></div></div>
            <div class="box"><div class="box-title">2. PERİYOT</div><div class="box-val" id="m-q2"></div></div>
            <div class="box"><div class="box-title">İLK YARI</div><div class="box-val" id="m-iy"></div></div>
        </div>
        <div class="grid-3">
            <div class="box"><div class="box-title">3. PERİYOT</div><div class="box-val" id="m-q3"></div></div>
            <div class="box"><div class="box-title">4. PERİYOT</div><div class="box-val" id="m-q4"></div></div>
            <div class="box"><div class="box-title">MAÇ TOPLAMI</div><div class="box-val highlight" id="m-total"></div></div>
        </div>

        <div class="section-title">TAKIM BAZLI TAHMİNLER</div>
        <div class="grid-3">
            <div class="box"><div class="box-title">EV SAHİBİ</div><div class="box-val" id="m-home"></div></div>
            <div class="box"><div class="box-title">DEPLASMAN</div><div class="box-val" id="m-away"></div></div>
            <div class="box"><div class="box-title">BEKLENEN TOPLAM</div><div class="box-val highlight" id="m-calc-total"></div></div>
        </div>
    </div>
</div>

<script>
    let matchesData = [];

    document.addEventListener("DOMContentLoaded", () => {
        const dateInput = document.getElementById('match-date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
        loadMatches();
    });

    // Takvimi Tıklamayla Açan Fonksiyon
    function openCalendarPicker() {
        const dateInput = document.getElementById('match-date');
        if (dateInput.showPicker) {
            dateInput.showPicker(); // Mobil ve modern tarayıcılarda takvimi açar
        } else {
            dateInput.focus();
        }
    }

    async function loadMatches() {
        try {
            const selectedDate = document.getElementById('match-date').value;
            const res = await fetch('data.json');
            matchesData = await res.json();
            
            const grid = document.getElementById('match-grid');
            grid.innerHTML = '';

            if(!matchesData || matchesData.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #848e9c; padding: 40px;">Seçilen tarih (${selectedDate}) için maç bulunamadı.</div>`;
                return;
            }

            matchesData.forEach((m, idx) => {
                grid.innerHTML += `
                    <div class="match-card" onclick="openModal(${idx})">
                        <div class="card-header">
                            <span>${m.league}</span>
                        </div>
                        <div class="teams-box">
                            <div class="team-line"><span>${m.home}</span><span style="color:#848e9c">${m.analysis.exp_home}</span></div>
                            <div class="team-line"><span>${m.away}</span><span style="color:#848e9c">${m.analysis.exp_away}</span></div>
                        </div>
                        <div class="totals-row">
                            <div class="total-item">
                                <div class="label">MAÇ TOPLAMI</div>
                                <div class="val highlight">${m.analysis.match_total}</div>
                            </div>
                            <div class="total-item">
                                <div class="label">İLK YARI</div>
                                <div class="val">${m.analysis.first_half}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        } catch (e) {
            console.error("Veri okunamadı:", e);
        }
    }

    function onDateChange() {
        loadMatches();
    }

    function changeDate(days) {
        const dateInput = document.getElementById('match-date');
        const currDate = new Date(dateInput.value);
        currDate.setDate(currDate.getDate() + days);
        dateInput.value = currDate.toISOString().split('T')[0];
        loadMatches();
    }

    function openModal(index) {
        const m = matchesData[index];
        document.getElementById('m-league').innerText = m.league;
        document.getElementById('m-teams').innerText = `${m.home} vs ${m.away}`;
        document.getElementById('m-q1').innerText = m.analysis.q1;
        document.getElementById('m-q2').innerText = m.analysis.q2;
        document.getElementById('m-q3').innerText = m.analysis.q3;
        document.getElementById('m-q4').innerText = m.analysis.q4;
        document.getElementById('m-iy').innerText = m.analysis.first_half;
        document.getElementById('m-total').innerText = m.analysis.match_total;
        document.getElementById('m-home').innerText = m.analysis.exp_home;
        document.getElementById('m-away').innerText = m.analysis.exp_away;
        document.getElementById('m-calc-total').innerText = m.analysis.match_total;

        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }
</script>
</body>
</html>
